name: Publish memorial website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare original static website
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R assets/fonts _site/assets/fonts
          unzip -q assets/photos.zip -d _site/assets
          unzip -q assets/artwork.zip -d _site/assets
          test -f _site/assets/revision-07/background.png
          test -f _site/assets/photos/00.webp
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

